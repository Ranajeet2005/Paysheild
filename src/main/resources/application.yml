
spring:
  application:
    name: paysheild

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/paysheild}
    username: ${DB_USERNAME:paysheild_user}
    password: ${DB_PASSWORD:local_dev_password}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
