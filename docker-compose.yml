
services:
  postgres:
    image: postgres:16
    container_name: paysheild-postgres
    environment:
      POSTGRES_DB: paysheild
      POSTGRES_USER: paysheild_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - paysheild_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paysheild_user -d paysheild"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  paysheild_postgres_data:
